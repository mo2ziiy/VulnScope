# Virtual uv workspace root (DEC-063). Holds shared dev tooling only; no installable package here.

[tool.uv]
required-version = "==0.12.21"
# Supply-chain guards: never build packages from source (no third-party build scripts run)
# and never download a Python interpreter implicitly.
no-build = true
python-downloads = "never"

[tool.uv.workspace]
members = ["services/api", "services/worker", "services/scanner", "packages/rules"]

[dependency-groups]
dev = [
  "ruff==0.16.9",
  "mypy==2.3.1",
  "detect-secrets==1.5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = [
  "services/api/src",
  "services/worker/src",
  "services/scanner/src",
  "packages/rules/src",
]
files = [
  "services/api/src",
  "services/worker/src",
  "services/scanner/src",
  "packages/rules/src",
  "tools",
]
