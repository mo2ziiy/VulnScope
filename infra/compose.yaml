# VulnScope local development stack (Task 01.1b).
# Local only: these services are not production configuration.
# Scope of 01.1b-02a: PostgreSQL only. redis-core, redis-scan and scan_net come later.
#
#   uv run --frozen python tools/gen_local_secrets.py
#   docker compose -f infra/compose.yaml up -d --wait
#   docker compose -f infra/compose.yaml down        # keeps data; never use -v casually

name: vulnscope

services:
  postgres:
    # DEC-067: PostgreSQL 18.6, pinned by index digest. Never pulled implicitly.
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    pull_policy: never
    user: "999:999" # image's postgres user; no root entrypoint steps needed
    # Versioned client authentication: no trust rules (see infra/postgres/pg_hba.conf).
    command: ["postgres", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # PostgreSQL 18 image layout: mount the parent; PGDATA is /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
      - type: bind
        source: ./postgres/pg_hba.conf
        target: /etc/postgresql/pg_hba.conf
        read_only: true
    tmpfs:
      - /var/run/postgresql:uid=999,gid=999,mode=0775,size=8m
      - /tmp:uid=999,gid=999,mode=1777,size=64m
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - core_net
    ports:
      - "127.0.0.1:55432:5432" # loopback only
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres", "-h", "/var/run/postgresql"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: 128m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 256

networks:
  core_net:
    driver: bridge

volumes:
  pgdata:

secrets:
  postgres_password:
    file: ./.secrets/postgres_password
