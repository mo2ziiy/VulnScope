# VulnScope local PostgreSQL client authentication (Task 01.1b-02a).
# Loaded via `-c hba_file=/etc/postgresql/pg_hba.conf` (infra/compose.yaml), mounted read-only.
# Replaces the image's initdb defaults, which trust local and loopback connections.
#
# Policy:
#   - No trust, md5 or password (cleartext) rules.
#   - Unix socket: peer for the `postgres` role only. The container runs as uid 999, which is
#     OS user `postgres`, so the healthcheck, `docker compose exec` and the entrypoint work
#     without a password. Any other OS user (for example root) is rejected.
#   - Unix socket, any other role: scram-sha-256.
#   - TCP, IPv4 and IPv6, including container loopback: scram-sha-256.
#   - Replication: no rules, so all replication connections are rejected.
#
# First match wins. Changes need a server restart or `SELECT pg_reload_conf()`.

# TYPE  DATABASE  USER      ADDRESS    METHOD
local   all       postgres             peer
local   all       all                  scram-sha-256
host    all       all       0.0.0.0/0  scram-sha-256
host    all       all       ::/0       scram-sha-256
